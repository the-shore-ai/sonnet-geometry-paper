name: Compact verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-compact.txt
      - run: python recipes/verify_release.py --figures
      - run: PYTHONPATH=src pytest -q tests/test_signal_audit.py

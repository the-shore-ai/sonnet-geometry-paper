[project]
name = "sonnet-geometry-modern-runtime"
version = "0.1.0"
description = "Isolated audited Gemma4 and Muse Glimmer extraction runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1",
  "transformers==5.20.1",
  "huggingface-hub==1.31.0",
  "tokenizers==0.23.3",
  "safetensors==0.8.0",
  "accelerate==1.10.1",
  "numpy==2.3.4",
  "scipy==1.16.3",
  "scikit-learn==1.7.2",
  "matplotlib==3.10.7",
  "google-cloud-storage==3.4.1",
  "modal==1.6.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[tool.uv]
package = false

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sonnet-geometry"
version = "0.1.0"
description = "Private, reproducible research on transformer representations of Shakespeare's sonnets"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1",
  "transformers==4.57.1",
  "huggingface-hub==0.36.0",
  "safetensors==0.6.2",
  "numpy==2.3.4",
  "scipy==1.16.3",
  "scikit-learn==1.7.2",
  "matplotlib==3.10.7",
  "google-cloud-storage==3.4.1",
  "modal==1.6.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[project.scripts]
sonnet-geometry = "sonnet_geometry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sonnet_geometry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
